# ======================================================
# Mac / Linux 专用配置（profile: mac）
# Redis Sentinel + MySQL 33061
# ======================================================
spring:
  config:
    activate:
      on-profile: mac
  # ------------------------
  # MySQL 数据库
  # ------------------------
  datasource:
    url: jdbc:mysql://localhost:33061/salary_admin_v3?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false
    username: root
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5             # 启动时预创建 5 个空闲连接
      maximum-pool-size: 20
      connection-timeout: 30000
      idle-timeout: 600000
      initialization-fail-timeout: 0  # 启动时初始化连接池，不等待第一次请求

  # ------------------------
  # Redis Sentinel 配置（Spring Boot 3.x 正确写法）
  # ------------------------
  data:
    redis:
      # Sentinel 模式
      sentinel:
        master: mymaster
        nodes:
          - 127.0.0.1:26379
          - 127.0.0.1:26380
          - 127.0.0.1:26381
      # Redis Master 密码（Sentinel 会透传）
      password: ${REDIS_PASSWORD:123456}
      database: 0
      # 连接超时
      timeout: 5000ms
      allow-fallback: false # 生产环境建议设为 false

langchain4j:
  # 1. 大模型配置 (Ollama - DeepSeek)
  ollama:
    chat-model:
      base-url: http://localhost:11434
      model-name: deepseek-r1:14b     # 确保与你 ollama list 看到的名称一致
      temperature: 0.7                # 采样温度，0.7 适合兼顾创意与逻辑
      timeout: PT60S                  # 推理时间可能较长，设置 60s 超时
      log-requests: true              # 开发阶段开启，控制台可看发送给 AI 的原始报文
      log-responses: true             # 开启，可看 AI 返回的原始报文（含 Reasoning 字段）

    # 2. 向量化模型配置 (用于将文本转为数字向量)
    embedding-model:
      base-url: http://localhost:11434
      model-name: nomic-embed-text    # 推荐使用这个，维度是 768

  # 3. 向量数据库配置 (Milvus)
  milvus:
    uri: http://localhost:19530       # Milvus 默认端口
    # token: "root:Milvus"            # 如果你设置了用户名密码则开启
    collection-name: salary_kb        # 存储薪酬知识库的集合名称
    dimension: 768                    # 必须与 nomic-embed-text 的输出维度一致
    index-type: IVF_FLAT              # 索引类型，IVF_FLAT 适合本地中小型数据
    metric-type: COSINE               # 相似度算法，推荐余弦相似度

